version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /tests/smoke
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"

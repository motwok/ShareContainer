name: Publish

# Pushes the image for both platforms, smoke-tests the pushed image, then moves :latest and
# publishes the release drafted by Build.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  IMG: ghcr.io/motwok/sharecontainer

jobs:
  push:
    name: Push (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: VERSION=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMG }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests

  manifest:
    name: Version tag
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create :${{ inputs.version }}
        run: |
          docker buildx imagetools create -t "$IMG:${{ inputs.version }}" \
            "$IMG@$(cat digests/amd64)" "$IMG@$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMG:${{ inputs.version }}"

  smoke:
    name: Smoke (${{ matrix.arch }})
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The pushed image passes the smoke test
        run: |
          docker pull "$IMG:${{ inputs.version }}"
          IMAGE="$IMG:${{ inputs.version }}" sh tests/smoke/run.sh

  release:
    name: Release
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move :latest
        run: docker buildx imagetools create -t "$IMG:latest" "$IMG:${{ inputs.version }}"
      - name: Publish release
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ inputs.version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Packages

# Daily: rebuild the image and compare all installed Debian packages with the published :latest.
# Only on a difference the new image is published as a patch release listing the changes.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMG: ghcr.io/motwok/sharecontainer

jobs:
  compare:
    name: Compare packages
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.diff.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build without publishing
        run: docker build --pull -t sharecontainer:check .
      - name: Package lists
        id: diff
        run: |
          docker run --rm --entrypoint cat sharecontainer:check /usr/share/sharecontainer-packages.txt | sort > new.txt
          if ! docker pull -q "$IMG:latest" >/dev/null 2>&1; then
            echo "No published image yet." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker run --rm --entrypoint cat "$IMG:latest" /usr/share/sharecontainer-packages.txt | sort > old.txt
          if cmp -s old.txt new.txt; then
            echo "Packages unchanged." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "Updated distribution packages:"
            echo
            join -a1 -a2 -e '(none)' -o 0,1.2,2.2 old.txt new.txt | awk '$2 != $3 { print "- " $1 ": " $2 " -> " $3 }'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF_NOTES"
            cat notes.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - name: Next patch version
        id: version
        if: steps.diff.outputs.changed == 'true'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<EOF
          ${last#v}
          EOF
          echo "version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test of the new image
    needs: compare
    if: needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull -t sharecontainer:test .
      - run: IMAGE=sharecontainer:test sh tests/smoke/run.sh

  publish:
    name: Publish
    needs:
      - compare
      - smoke
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      packages: write
      pull-requests: read
    with:
      version: ${{ needs.compare.outputs.version }}
      drafter: false
      notes: ${{ needs.compare.outputs.notes }}

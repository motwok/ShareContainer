name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test tools
        run: pip install pytest coverage pyyaml bcrypt
      - name: Test with coverage
        run: |
          python -m coverage run --branch --source=src/sharecontainer -m pytest -q -p no:cacheprovider tests/unit
          python -m coverage report -m --fail-under=100
      - name: Summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t sharecontainer:test .
      - name: Smoke test over every protocol
        run: IMAGE=sharecontainer:test sh tests/smoke/run.sh

  release:
    name: Release
    needs:
      - unit
      - smoke
    if: github.event_name != 'pull_request' && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release: ${{ steps.changed.outputs.release }}
      version: ${{ steps.drafter.outputs.resolved_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Image changed since last release?
        id: changed
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- src bin Dockerfile; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant change since $last, no release." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The draft gives the version; it is published only after the pushed image passed the smoke test.
      - name: Draft release
        id: drafter
        if: steps.changed.outputs.release == 'true'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.release == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      packages: write
      pull-requests: read
    with:
      version: ${{ needs.release.outputs.version }}
      drafter: true

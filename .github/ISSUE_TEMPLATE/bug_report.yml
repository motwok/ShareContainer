name: Bug report
description: Report something that doesn't work as expected.
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the fields below;
        the details make it much easier to reproduce and fix. Remove host names,
        addresses, user names or share names you do not want to make public.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This is **not** a security vulnerability (those go through [SECURITY.md](https://github.com/motwok/ShareContainer/security/advisories/new), not a public issue).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: The share is not visible / access is denied / only one SMB connection / ...
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: Symptoms
      description: Which did you observe?
      options:
        - label: The container does not start
        - label: A share is not reachable or access is denied
        - label: Users or passwords are missing after a rebuild
        - label: Multichannel does not use several connections
        - label: Other (describe above)

  - type: input
    id: version
    attributes:
      label: ShareContainer version
      description: Image tag or digest.
      placeholder: e.g. 1.2.3 or sha256:...
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      multiple: true
      options:
        - SMB
        - WebDAV
        - SFTP or scp
        - rsync
        - Borg
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network mode
      options:
        - host
        - macvlan, configured address
        - macvlan, DHCP
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host platform
      description: Distribution, architecture, kernel (`uname -r`) and Docker version.
      placeholder: e.g. Debian 13 amd64 6.12 Docker 28
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client
      description: Operating system and version, NIC team yes/no.
      placeholder: e.g. Windows 11 24H2, LBFO team (LACP)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant configuration and container logs
      description: The affected part of your configuration and the output of `docker logs <container>`. For Multichannel, `Get-SmbMultichannelConnection` during a copy.
      render: text
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Even rough steps help.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Compose file excerpt, screenshots, anything else.
    validations:
      required: false
